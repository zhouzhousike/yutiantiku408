<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PCOS 减脂与身体状态追踪工作台</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#FDF9EE; --panel:#ffffff; --ink:#56565B; --muted:#97979C; --line:#E6E4DA;
    --brand:#B6C2CF; --brand-d:#7C8997; --brand-l:#DBDDDA;
    --accent:#B6C2CF; --accent-l:#DBDDDA; --soft:#EEF0ED;
    --warn:#b4543f; --ok:#5d7d4f; --period:#b4543f;
    --r:14px; --sh:0 1px 3px rgba(60,50,40,.08),0 6px 18px rgba(60,50,40,.07);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:78px}
  a{color:var(--brand-d)}
  .main{max-width:1080px;margin:0 auto;padding:18px 16px 24px;width:100%}
  h1{font-size:21px;margin:2px 0 4px;font-weight:700}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  h2{font-size:16px;margin:18px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2 .tag{font-size:11px;font-weight:600;color:var(--brand-d);background:var(--brand-l);padding:2px 8px;border-radius:20px}
  .back{background:transparent;border:0;color:var(--brand-d);font-size:14px;cursor:pointer;padding:6px 0;margin:-4px 0 4px -4px;display:inline-flex;align-items:center;gap:4px}
  ul.dlist{list-style:none;margin:8px 0 0;padding:0}
  ul.dlist li{padding:7px 10px;background:var(--soft);border-radius:9px;margin-bottom:6px;font-size:13px;color:var(--ink)}
  ul.dlist li.reuse{background:var(--brand-l);color:var(--brand-d)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:14px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:720px){.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
  /* 手机端：饮食/食物库多列输入不压缩，改为横向滚动 */
  @media(max-width:720px){
    .meal-rows,.fooddb-rows{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .meal-rows .item-row,.fooddb-rows .food{min-width:620px}
  }
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
  .kpi .lab{font-size:12px;color:var(--muted);margin-bottom:4px}
  .kpi .val{font-size:21px;font-weight:700;color:var(--ink);letter-spacing:.2px}
  .kpi .val small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
  .kpi .delta{font-size:12px;margin-top:3px}
  .kpi.big{background:linear-gradient(135deg,var(--brand-l),var(--panel));border-color:var(--brand-l)}
  .kpi.big .val{font-size:27px;color:var(--brand-d)}
  .kpi.big .lab{color:var(--brand-d);font-weight:600}
  .kpi.warnk{border-color:#EAD9C9}
  .up{color:var(--ok)} .down{color:var(--warn)} .flat{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand-d);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(.96)}
  .btn.ghost{background:var(--soft);color:var(--brand-d)}
  .btn.ghost:hover{background:var(--brand-l)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn.warn{background:var(--warn)}
  .btn.block{width:100%;justify-content:center;padding:13px;font-size:15px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
  label.fld b{color:var(--ink);font-weight:600;font-size:13px}
  input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-d)}
  input[type=range]{padding:0;accent-color:var(--brand-d)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
  .chk input{width:auto}
  .seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--muted);font-family:inherit}
  .seg button.on{background:var(--brand-l);color:var(--brand-d);font-weight:600;box-shadow:var(--sh)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;background:var(--soft)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
  .pill.g{background:var(--brand-l);color:var(--brand-d)}
  .pill.a{background:var(--accent-l);color:var(--ink)}
  .pill.m{background:var(--soft);color:var(--muted)}
  .pill.r{background:var(--soft);color:var(--ink)}
  .note{background:var(--soft);border-left:3px solid var(--brand);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--muted);margin:8px 0}
  .alert{background:var(--soft);border-left:3px solid var(--brand-d);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--ink)}
  .chart-wrap{width:100%;overflow:hidden}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .meal{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;background:var(--soft)}
  .meal h4{margin:0 0 8px;font-size:13.5px;color:var(--brand-d);display:flex;justify-content:space-between;align-items:center}
  .item-row{display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr .7fr .7fr .7fr 28px;gap:6px;margin-bottom:6px;align-items:center}
  .item-row.head{font-size:11px;color:var(--muted);font-weight:600}
  .item-row input{padding:6px 7px;font-size:12.5px}
  .xbtn{background:var(--soft);color:var(--brand-d);border:0;border-radius:7px;cursor:pointer;font-size:14px;height:30px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .d{aspect-ratio:1/1;border:1px solid var(--line);border-radius:6px;padding:2px;font-size:9px;cursor:pointer;position:relative;background:var(--panel);overflow:hidden}
  .cal .d .dot{position:absolute;bottom:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--brand-d)}
  .cal .d.empty{border:0;background:none;cursor:default}
  .cal .d.sel{outline:2px solid var(--brand-d)}
  .cal .wd{text-align:center;font-size:9px;color:var(--muted);padding-bottom:1px}
  .cal + .legend{font-size:10px;gap:10px;margin-top:4px}
  .insight{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:8px}
  .insight .ic{font-size:17px;flex:none;color:var(--brand-d);display:flex}
  .insight .ic svg{width:16px;height:16px}
  h2 svg{width:18px;height:18px;flex:none}
  .alert svg{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:4px}
  .insight .tx{font-size:13px;line-height:1.5}
  .muted{color:var(--muted)}
  .hr{height:1px;background:var(--line);margin:14px 0;border:0}
  .copy-box{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:14px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.25s}
  .toast.show{opacity:1}
  .info{color:var(--muted);cursor:help;font-size:11px;font-weight:700;margin-left:3px;border:1px solid var(--line);border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  .flex1{flex:1}
  .mini{font-size:11px;color:var(--muted)}
  .mini svg{width:12px;height:12px;vertical-align:-1px}
  .pos{position:relative}
  .pbar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:5px}
  .pbar span{display:block;height:100%;border-radius:6px}
  .nut{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}
  .nut .lab{font-size:12px;color:var(--muted)}
  .nut .v{font-size:17px;font-weight:700}
  .nut .st{font-size:11px;margin-top:2px}
  .rec-btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--sh);margin-bottom:14px}
  /* 底部导航 */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:stretch;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;font-family:inherit;cursor:pointer;padding:0}
  .bottomnav button .ic{display:flex}
  .bottomnav button .ic svg{width:20px;height:20px}
  .bottomnav button.on{color:var(--brand-d)}
  .bottomnav .rec{flex:0 0 72px;position:relative}
  .bottomnav .rec .fab{position:absolute;top:-20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 16px rgba(124,137,151,.4);border:4px solid var(--panel)}
  .bottomnav .rec span{margin-top:22px}
  /* 抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(40,38,34,.42);z-index:70;display:none}
  .drawer-mask.open{display:block}
  .drawer{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:var(--panel);border-radius:18px 18px 0 0;z-index:71;transform:translateY(100%);transition:.25s;overflow:auto;padding:18px 16px 34px}
  .drawer.open{transform:translateY(0)}
  .drawer h3{margin:0 0 12px;font-size:16px}
  .drawer .close{float:right;background:var(--soft);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .hub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .hub button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;font-family:inherit;box-shadow:var(--sh)}
  .hub button .t{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .hub button .t svg{width:18px;height:18px;flex:none}
  .hub button .d{font-size:11.5px;color:var(--muted);margin-top:3px}
  .exp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:8px}
  .exp .meta{font-size:12px;color:var(--muted)}
  .food{display:grid;grid-template-columns:1.4fr .6fr .6fr .6fr .6fr .6fr .6fr 28px;gap:6px;margin-bottom:6px;align-items:center}
  .food.head{font-size:11px;color:var(--muted);font-weight:600}
  .food input{padding:6px 7px;font-size:12.5px}
  .tagpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .tagpick button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .tagpick button.on{background:var(--brand-l);color:var(--brand-d);border-color:var(--brand-l);font-weight:600}
</style>
</head>
<body>
<main class="main" id="main"></main>

<!-- 底部导航 -->
<nav class="bottomnav" id="nav">
  <button data-view="dashboard"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>首页</button>
  <button data-view="trends"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg></span>趋势</button>
  <button class="rec" id="recBtn"><span class="fab">＋</span><span>记录</span></button>
  <button data-view="weekly"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/></svg></span>周报</button>
  <button data-view="mine"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>我的</button>
</nav>

<!-- 快速记录抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="closeQuick()"></div>
<div class="drawer" id="drawer"><div id="drawerBody"></div></div>

<div class="toast" id="toast"></div>

<script>
/* ============ 存储与状态 ============ */
var KEY='pcos_track_v1';
var state=null;
function today(){var d=new Date();return fmtDate(d);}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function num(v){if(v===''||v==null)return 0;var n=Number(v);return isNaN(n)?0:n;}
function numOrNull(v){return isNum(v)?Number(v):null;} /* 空白→null，0→0，避免 num('')=0 误存 */
function round(v,d){d=d==null?1:d;var f=Math.pow(10,d);return Math.round(v*f)/f;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(sel,el){return (el||document).querySelector(sel);}
function $all(sel,el){return [].slice.call((el||document).querySelectorAll(sel));}
function info(tip){return ' <span class="info" title="'+esc(tip)+'">ⓘ</span>';}

function defaultState(){
  return {
    schemaVersion:4,
    profile:{height:158,birthYear:2003,startWeight:57,goalWeight:52,conditions:'PCOS；既往胰岛素抵抗',medsNote:'二甲双胍缓释片 0.5g，每日晚饭时一次'},
    targets:{kcalMin:1550,kcalMax:1650,proteinMin:90,proteinMax:100,fiberTarget:28,stepsTarget:4000,waterTarget:2000,stageNote:'第1周3000步/天，第2周4000，第3-4周5000，之后逐步提高'},
    days:{},
    cycles:[],
    periodLog:{},
    cycleStarts:{},
    pcosMonth:{},
    meds:[
      {id:'met',name:'二甲双胍缓释片',dose:'0.5g',time:'晚饭时',freq:'每日一次',active:true}
    ],
    medLog:{},
    foodDb:[],
    experiments:[],
    exercisePlan:{cycleStartDate:'',currentTemplate:'A',progressionWeek:1,templates:{}},
    plans:{exercise:{},meals:{}},
    dietPreferences:{disliked:['西葫芦'],chickenPreference:'去皮鸡腿肉',milkPreference:'无乳糖牛奶',cookedVegetables:true,dinnerMakesNextLunch:true,ingredientReuse:'high'}
  };
}
/* 归一化：补齐缺失字段与值清洗（不涉及版本号），load() 与 JSON 恢复共用 */
function normalizeState(d){
  var def=defaultState();
  for(var k in def){ if(d[k]===undefined) d[k]=def[k]; }
  if(!d.targets||typeof d.targets!=='object')d.targets=def.targets;
  if(!d.meds)d.meds=def.meds;
  if(!d.medLog)d.medLog={};
  if(!d.foodDb)d.foodDb=[];
  if(!d.experiments)d.experiments=[];
  if(!d.periodLog)d.periodLog={};
  if(!d.cycleStarts)d.cycleStarts={};
  if(!d.days)d.days={};
  if(!d.cycles)d.cycles=[];
  if(!d.pcosMonth)d.pcosMonth={};
  if(!d.exercisePlan)d.exercisePlan={cycleStartDate:'',currentTemplate:'A',progressionWeek:1,templates:{}};
  if(!d.exercisePlan.templates)d.exercisePlan.templates={};
  if(!d.plans)d.plans={exercise:{},meals:{}};
  if(!d.plans.exercise)d.plans.exercise={};
  if(!d.plans.meals)d.plans.meals={};
  if(!d.dietPreferences)d.dietPreferences={disliked:['西葫芦'],chickenPreference:'去皮鸡腿肉',milkPreference:'无乳糖牛奶',cookedVegetables:true,dinnerMakesNextLunch:true,ingredientReuse:'high'};
  if(!d.dietPreferences.disliked)d.dietPreferences.disliked=[];
  // 月经模型迁移：旧值 '正常月经' → '经期中'
  Object.keys(d.periodLog).forEach(function(dt){ if(d.periodLog[dt]==='正常月经') d.periodLog[dt]='经期中'; });
  return d;
}
/* 版本迁移：仅旧 schema(<3) 执行一次。先把已有 cycles[].start 全部写入 cycleStarts（防止手工历史周期丢失），
   再用连续「经期中」段首日补充缺失起点。新 schema(>=3) 直接返回，绝不再因连续经期段自动产生周期。 */
function migrateState(d){
  if(d.schemaVersion>=4)return d;
  (d.cycles||[]).forEach(function(c){ if(c&&c.start) d.cycleStarts[c.start]=true; });
  var keys=Object.keys(d.periodLog).filter(function(dt){return d.periodLog[dt]==='经期中';}).sort(),prev=null;
  keys.forEach(function(dt){ if(!(prev&&daysBetween(prev,dt)===1)) d.cycleStarts[dt]=true; prev=dt; });
  d.schemaVersion=4;
  return d;
}
/* 以 cycleStarts 为准重建 cycles（仅保留 metadata：start/end/flow/pain） */
function reconcileCycles(d){
  var meta={};(d.cycles||[]).forEach(function(c){ if(c&&c.start)meta[c.start]=c; });
  d.cycles=Object.keys(d.cycleStarts).filter(function(dt){return d.cycleStarts[dt];}).sort().map(function(s){ var m=meta[s]||{}; return {type:'normal',start:s,end:m.end||'',flow:m.flow||'',pain:(m.pain!=null?m.pain:null)}; });
  return d;
}
/* load 与 JSON 恢复的统一入口 */
function finalizeState(d){ return reconcileCycles(migrateState(normalizeState(d))); }
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){ return finalizeState(JSON.parse(s)); }
  }catch(e){}
  return defaultState();
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));var c=cloudCfg();if(c.auto&&c.token)cloudPushDebounced();}
function getDay(s){return state.days[s]||{};}
function dayKeys(){return Object.keys(state.days).sort();}
function dayExists(s){return !!state.days[s];}

/* ============ 聚合计算 ============ */
function mealsOf(d){
  d=d||{};var m=d.meals||{};
  var tot={kcal:0,protein:0,carb:0,fat:0,fiber:0},cnt={kcal:0,protein:0,carb:0,fat:0,fiber:0};
  ['breakfast','lunch','snack1','dinner','snack2'].forEach(function(k){
    (m[k]||[]).forEach(function(it){
      ['kcal','protein','carb','fat','fiber'].forEach(function(f){
        if(isNum(it[f])){ tot[f]+=Number(it[f]); cnt[f]++; }
      });
    });
  });
  return {tot:tot,cnt:cnt};
}
function dayNutrition(d){
  d=d||{};var m=mealsOf(d);
  // 每个营养素独立判断：餐食里该营养素有记录（isNum）或整日估算有值，否则为 null（不参与均值）

  // 漏记一天经期不会产生新周期，因为起点从不由连续段自动生成。
  var cs=state.cycleStarts||{};

function cycleMeta(start){

function cycleInfoAt(date){
  date=date||today();
  var starts=cycleStartDates();
  // 先过滤所有 start<=date 的周期起点；历史日期绝不使用未来周期计算近3周期均值
  var normals=starts.filter(function(s){return daysBetween(s,date)>=0;}).map(function(s){ var m=cycleMeta(s)||{}; return {start:s,end:m.end||'',flow:m.flow||'',pain:(m.pain!=null?m.pain:null),type:'normal'}; });
  var last=normals.length?normals[normals.length-1]:null;
  var since=null,day=null;
  if(last){ since=daysBetween(last.start,date); day=since+1; }
  var lengths=[]; for(var j=1;j<normals.length;j++)lengths.push(daysBetween(normals[j-1].start,normals[j].start));
  var avg3=lengths.length?round(lengths.slice(-3).reduce(function(a,b){return a+b;},0)/Math.min(3,lengths.length),0):null;

}

/* ============ 图表 ============ */
function chartSVG(labels,series,opts){
  opts=opts||{};var W=680,H=opts.h||180,pad={l:34,r:10,t:14,b:24};
  var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  var all=[];series.forEach(function(s){s.data.forEach(function(v){if(v!=null)all.push(v);});});
  if(!all.length)all=[0,1];
  var min=Math.min.apply(null,all),max=Math.max.apply(null,all);
  if(min===max){min-=1;max+=1;}
  var rng=max-min;
  function X(i){return pad.l+iw*(labels.length<=1?0:i/(labels.length-1));}
  function Y(v){return pad.t+ih*(1-(v-min)/rng);}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(var g=0;g<=3;g++){var yy=pad.t+ih*g/3;var vv=round(max-rng*g/3,opts.dec||0);
    svg+='<line x1="'+pad.l+'" y1="'+yy+'" x2="'+(W-pad.r)+'" y2="'+yy+'" stroke="#EAE5DC" stroke-width="1"/>';
    svg+='<text x="'+(pad.l-5)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="#9A9286">'+vv+'</text>';}
  var step=Math.ceil(labels.length/6);
  labels.forEach(function(l,i){if(i%step===0||i===labels.length-1){svg+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="#9A9286">'+esc(l)+'</text>';}});
  series.forEach(function(s){
    var pts=[];s.data.forEach(function(v,i){if(v!=null)pts.push(X(i)+','+Y(v));});
    var dash=s.dash?'stroke-dasharray="5 4"':'';
    svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2.2)+'" stroke-linecap="round" stroke-linejoin="round" '+dash+'/>';
    s.data.forEach(function(v,i){if(v!=null){svg+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="2.4" fill="'+s.color+'"/>';}});
  });
  if(opts.markers){opts.markers.forEach(function(mk){var cx=X(mk.i);svg+='<circle cx="'+cx+'" cy="'+(pad.t+9)+'" r="4.2" fill="'+(mk.color||'#999')+'" opacity="0.9"><title>'+esc(mk.title||'')+'</title></circle>';});}
  svg+='</svg>';
  return svg;
}

function daysSinceBowel(end){
  // 连续明确的 bowel===false 才提示"连续X天未排便"；中间存在 null 时提示"距上次记录排便X天，期间存在未记录日期"
  var lastTrue=null,lastTrueIdx=null;
  for(var i=0;i<=120;i++){var d=addDays(end,-i);if(getDay(d).bowel===true){lastTrue=d;lastTrueIdx=i;break;}}
  var run=0,nullInRun=false;
  for(var j=0;j<=120;j++){
    var d=addDays(end,-j);
    var b=getDay(d).bowel;
    if(b===false){ run++; }
    else if(b===true){ break; }
    else { nullInRun=true; break; } // 遇到未记录日期，连续段中断
  }
  if(run>0 && !nullInRun) return {txt:run+' 天',note:'已连续 '+run+' 天明确未排便'};
  if(lastTrue){
    var g=lastTrueIdx;
    if(g===0)return {txt:'今天',note:'今日已记录排便'};
    if(g===1)return {txt:'1 天',note:'昨日已记录排便'};
    return {txt:g+' 天',note:'距上次记录排便 '+g+' 天，期间存在未记录日期'};
  }
  return {txt:'未记录',note:'尚无排便记录'};
}
function weightNote(end){
  var w7=avgWeight(rangeDays(end,7)),todayW=num(getDay(end).weight);
  var factors=[];
  var x=getDay(end);
  if(x.bowel===false)factors.push('排便（明确未排）');
  if(x.highSaltTakeout)factors.push('饮食钠含量（高盐外卖）');
  if(state.periodLog[end]==='经期中')factors.push('经期');
  if(x.lactuloseTaken)factors.push('乳果糖');
  if(num(x.sleepHours)>0&&num(x.sleepHours)<6)factors.push('睡眠不足');
  if(x.trained)factors.push('训练后肌肉充水');
  if(!todayW)return '<div class="note">今天尚未记录体重，记录后这里会给出客观提示，不会以单日数字下结论。</div>';
  if(w7!=null&&todayW>w7+0.3){
    if(factors.length)return '<div class="note">今日体重比 7 日平均高 '+round(todayW-w7,2)+' kg，可能同时受到'+factors.join('、')+'等因素影响，建议继续观察 7 日平均值，不轻易判断为脂肪增加。</div>';
    return '<div class="note">今日体重比 7 日平均高 '+round(todayW-w7,2)+' kg，属正常波动范围，建议观察 7 日平均值。</div>';
  }
  if(w7!=null&&todayW<w7-0.3){
    return '<div class="note">今日体重比 7 日平均低 '+round(w7-todayW,2)+' kg，可能是水分或进食时间差异，建议观察 7 日平均值。</div>';
  }
  return '<div class="note">今日体重与 7 日平均基本持平，维持记录即可。</div>';
}

function insightsCard(end){
  var ins=[];
  var w7=avgWeight(rangeDays(end,7)),w7p=avgWeight(rangeDays(addDays(end,-7),7));
  if(w7!=null&&w7p!=null){var d=round(w7-w7p,2);ins.push(['down','7日平均体重比上周'+(d<0?'下降 '+Math.abs(d):(d>0?'上升 '+d:'无明显变化'))+' kg，以7日均判断更稳。']);}
  var dates30=rangeDays(end,30);
  var waistNow=lastVal(dates30,'waist'),waistPrev=null;
  for(var i=dates30.length-8;i>=0;i--){var w=num(getDay(dates30[i]).waist);if(w>0){waistPrev=w;break;}}
  if(waistNow&&waistPrev&&waistNow<waistPrev)ins.push(['ruler','体重变化不明显，但腰围较前期下降 '+round(waistPrev-waistNow,1)+' cm，围度改善值得留意。']);
  var stepAvg=avgOf(rangeDays(end,7),'steps'),stepPrev=avgOf(rangeDays(addDays(end,-7),7),'steps');
  if(stepAvg&&stepPrev&&stepPrev>0){var pct=round((stepAvg-stepPrev)/stepPrev*100,0);if(pct>=10)ins.push(['walk','本周平均步数比上周提高 '+pct+'%。']);}
  var corr=gutCorrelation(addDays(end,-29),end); /* Item5: 固定分析 end 前 30 天，与页面区间一致 */
  corr.forEach(function(c){if(c.flag)ins.push(['leaf',c.text]);});
  var ci=cycleInfoAt(end); /* Item4: 用区间结束日的周期阶段，不用 today() */
  if(ci.day!=null&&ci.day>=22&&ci.day<=28){var h=avgOf(rangeDays(end,7),'hunger'),hp=avgOf(rangeDays(addDays(end,-7),7),'hunger');if(h>0&&hp>0&&h>hp+0.5)ins.push(['period','本周处于可能经前阶段，平均饥饿评分较上周升高，属常见波动。']);}
  if(!ins.length)ins.push(['bulb','记录满 7 天后会在这里出现趋势提示。']);
  return '<div class="card"><h2 style="margin-top:0">本周客观提示 <span class="tag">仅描述数据，不做诊断</span></h2>'+ins.map(function(x){return '<div class="insight"><div class="ic">'+ICON(x[0])+'</div><div class="tx">'+x[1]+'</div></div>';}).join('')+'</div>';
}

  $all('#drawerBody [data-q]').forEach(function(el){

    el.addEventListener(ev,function(){el.setAttribute('data-touched','1');});
  });
  var qs=$('#quickSave');if(qs)qs.onclick=function(){
    var day=state.days[d]||{};
    $all('#drawerBody [data-q]').forEach(function(el){var k=el.getAttribute('data-q');if(el.getAttribute('data-touched')!=='1')return;
      if(el.tagName==='SELECT'&&el.options[0]&&el.options[0].value===''&&el.querySelector('option[value="0"]')&&el.querySelector('option[value="1"]')){ // tri 三态
        if(el.value==='1')day[k]=true; else if(el.value==='0')day[k]=false; else delete day[k];
      }
      else if(el.type==='range'){ if(el.getAttribute('data-empty')==='1')delete day[k]; else day[k]=Number(el.value); }
      else if(el.type==='checkbox'){ day[k]=el.checked; }

    state.days[d]=day;save();closeQuick();toast('已保存 '+d);
    if(VIEW==='dashboard')render();
  };
}

  }

function sectionHTML(s,d){

  var optNames=[];
  s.f.forEach(function(f){ if(f.opt&&optNames.indexOf(f.opt)<0)optNames.push(f.opt); });
  optNames.forEach(function(name){
    var fields=s.f.filter(function(f){return f.opt===name;});
    var condOk=true; if(fields[0].cond)condOk=condMet(fields[0].cond,d);
    if(!condOk)return;
    var open=!!UI.opt[optKey(name)];

}

function dietProgress(d){

  var kcalStatus=(n.kcal==null)?'未记录':(n.kcal>=t.kcalMin&&n.kcal<=t.kcalMax?'<span class="st down">在目标范围内</span>':(n.kcal<t.kcalMin?'<span class="st flat">偏低</span>':'<span class="st flat">略超上限（正常波动）</span>'));
  var proPct=(n.protein==null)?0:Math.min(100,n.protein/t.proteinMax*100);
  var fibPct=(n.fiber==null)?0:Math.min(100,n.fiber/t.fiberTarget*100);

    '<div class="grid g2">'+
    '<div class="nut"><div class="lab">热量</div><div class="v">'+v0(n.kcal)+' <small>kcal</small></div>'+kcalStatus+pbar(kcalPct,'rgba(124,137,151,.7)')+'<div class="mini">目标 '+t.kcalMin+'-'+t.kcalMax+'</div></div>'+
    '<div class="nut"><div class="lab">蛋白质</div><div class="v">'+v0(n.protein)+' <small>g</small></div><div class="st flat">今日 '+v0(n.protein)+' / '+t.proteinMin+'–'+t.proteinMax+'g</div>'+pbar(proPct,'#7C8997')+'</div>'+
    '<div class="nut"><div class="lab">膳食纤维</div><div class="v">'+v0(n.fiber)+' <small>g</small></div><div class="st flat">目标 '+t.fiberTarget+'g</div>'+pbar(fibPct,'rgba(124,137,151,.35)')+'</div>'+
    '<div class="nut"><div class="lab">饮水</div><div class="v">'+v0(n.water)+' <small>ml</small></div><div class="st flat">目标 '+t.waterTarget+'ml</div>'+pbar(waterPct,'rgba(124,137,151,.6)')+'</div>'+
    '</div></div>';

function readDailyForm(){
  var d=state.days[UI.dailyDate]||{};
  $all('#main [data-k]').forEach(function(el){var k=el.getAttribute('data-k');
    var ty=el.getAttribute('data-ty');
    if(ty==='tags'){ if(el.getAttribute('data-touched')!=='1')return; var arr=Array.prototype.map.call(el.querySelectorAll('.mbtn.on'),function(b){return b.getAttribute('data-v');}); if(arr.length)d[k]=arr; else delete d[k]; return; }
    if(ty==='seg'||ty==='bristol'){ if(el.getAttribute('data-touched')!=='1')return; var on=el.querySelector('.mbtn.on'); if(on)d[k]=Number(on.getAttribute('data-v')); else delete d[k]; return; }
    if(el.tagName==='SELECT'&&el.getAttribute('data-k')&&el.querySelector('option[value="0"]')&&el.querySelector('option[value="1"]')&&el.options[0].value===''){ // tri 三态选择
      if(el.value==='1')d[k]=true;
      else if(el.value==='0')d[k]=false;
      else delete d[k]; // 未记录：不写入 false
    }
    else if(el.type==='range'){ // 评分：data-empty=1 表示"未记录"
      if(el.getAttribute('data-empty')==='1')delete d[k];
      else d[k]=Number(el.value);
    }
    else if(el.type==='checkbox')d[k]=el.checked;
    else if(el.type==='number')d[k]=el.value===''?'':Number(el.value);
    else d[k]=el.value;
  });
  // 月经：periodLog 唯一出血源。留空=保持原状；明确选"无出血"才删除；不因 UI 为空误删
  var pvEl=document.getElementById('dailyPeriod');
  if(pvEl){var pv=pvEl.value;
    if(pv==='无出血')delete state.periodLog[UI.dailyDate];
    else if(pv)state.periodLog[UI.dailyDate]=pv;
  }
  var d1El=document.getElementById('dailyPeriodDay1');
  if(d1El){
    if(d1El.checked)addCycleIfNew(UI.dailyDate);
    else if(state.cycleStarts&&state.cycleStarts[UI.dailyDate])delete state.cycleStarts[UI.dailyDate];
  }
  // P1 睡眠时长按入睡/起床时间自动计算（支持跨午夜）
  if(d.sleepTime&&d.wakeTime){var shs=sleepHoursOf(d);if(shs!=null)d.sleepHours=shs;}
  d.meals={};
  MEALS.forEach(function(m){var rows=$all('.meal-rows[data-meal="'+m[0]+'"] .item-row:not(.head)');
    d.meals[m[0]]=rows.map(function(r){return {
      name:r.querySelector('[data-ik=name]').value,
      gram:numOrNull(r.querySelector('[data-ik=gram]').value),

function gutCorrelation(startDate,endDate){
  // Item5: 只分析 startDate~endDate 区间，不再隐式取 today 之前 N 天
  var dates=rangeDays(endDate,daysBetween(startDate,endDate)+1);
  // 仅取记录了腹胀的日（结局指标为腹胀），按暴露/非暴露分组对比平均腹胀
  var recs=dates.map(function(d){return {d:d,x:getDay(d)};}).filter(function(r){return r.x.bloat!=null&&!isNaN(Number(r.x.bloat));});
  function groupMean(arr){
    var v=arr.filter(function(r){return r.x.bloat!=null&&!isNaN(Number(r.x.bloat));});
    if(!v.length)return {n:0,mean:null};
    var s=v.reduce(function(a,r){return a+Number(r.x.bloat);},0);
    return {n:v.length,mean:round(s/v.length,1)};
  }
  // Item6: 暴露三态。flagFn 返回 true=暴露 / false=未暴露 / null=该日未记录此因素，两组都不进入
  function compare(flagFn,label){
    var exp=[],nex=[];
    recs.forEach(function(r){var f=flagFn(r.x,r.d);if(f===true)exp.push(r);else if(f===false)nex.push(r);});
    var e=groupMean(exp),n=groupMean(nex);
    if(e.n<3||n.n<3)return {flag:false,text:label+'：有'+label+'日 n='+e.n+'、无'+label+'日 n='+n.n+'（未记录该因素的 '+(recs.length-e.n-n.n)+' 天不计入任一组），任一组样本不足（需≥3），继续记录后可观察。'};
    var diff=round(e.mean-n.mean,1);
    // 差异幅度门槛：两组均≥3只是最低数据要求；差<1.0分不视为值得关注的相关趋势
    if(Math.abs(diff)<1.0){
      return {flag:false,text:label+'：有'+label+'日 平均腹胀 '+e.mean+'/10（n='+e.n+'）；无'+label+'日 平均腹胀 '+n.mean+'/10（n='+n.n+'）。差异 '+diff+' 分（<1.0），趋势尚不明显，建议继续观察。'};
    }
    var dir = diff>0 ? ('有'+label+'日平均腹胀更高（'+e.mean+' vs '+n.mean+'/10，差 '+diff+'），是一个值得继续观察的相关趋势。')
                : diff<0 ? ('有'+label+'日平均腹胀反而更低（'+e.mean+' vs '+n.mean+'/10，差 '+diff+'），未见腹胀加重趋势。')
                : ('有'+label+'日与无'+label+'日平均腹胀均为 '+e.mean+'/10，未见差异。');
    return {flag:diff>0,text:label+'：有'+label+'日 平均腹胀 '+e.mean+'/10（n='+e.n+'）；无'+label+'日 平均腹胀 '+n.mean+'/10（n='+n.n+'）。'+dir};
  }
  // 三态因子辅助：val===true→true，val===false→false，其余（未记录）→null
  function tri(v){return v===true?true:(v===false?false:null);}
  function numTri(v){var n=scoreVal(v);return n==null?null:n;} // 数值型：未填(空)→null，不默认 0
  var out=[];
  out.push(compare(function(x){return tri(x.lactuloseTaken);},'乳果糖'));
  // 普通牛奶：没填 ml→null（不算 0ml）；填了：ml>0 且未换无乳糖→暴露；ml=0 或已换→未暴露
  out.push(compare(function(x){
    var ml=numTri(x.milkNormalMl); if(ml==null)return null;
    if(ml>0)return x.milkLactoseFree!==true; return false;
  },'普通牛奶'));
  out.push(compare(function(x){return tri(x.soyHeavy);},'豆制品'));
  out.push(compare(function(x){return tri(x.spicy);},'辛辣'));
  out.push(compare(function(x){return tri(x.highSaltTakeout);},'高盐外卖'));
  out.push(compare(function(x){var b=tri(x.bowel);if(b==null)return null;return !b;},'明确未排便')); // bowel=null 不进组；false=暴露(未排便)；true=未暴露(已排便)
  out.push(compare(function(x,d){var ci=cycleInfoAt(d);if(ci.day==null)return null;return ci.day>=25;},'周期后期'));
  out.push(compare(function(x){var h=scoreVal(x.sleepHours);if(h==null)return null;return h>0&&h<6;},'睡眠不足'));
  out.push(compare(function(x){var s=scoreVal(x.stress);if(s==null)return null;return s>=7;},'高压力'));
  return out;
}

function weekMetrics(dates){
  var valid=dates.filter(function(d){return dayExists(d);});
  // P0-2 每指标独立有效样本：仅排除未记录(null/undefined/''),0 视为有效参与均值；无有效记录返回 null
  function av(key){
    var arr=[];
    dates.forEach(function(d){var x=getDay(d)[key];if(x!==undefined&&x!==null&&x!=='')arr.push(num(x));});
    return {n:arr.length, mean: arr.length? round(arr.reduce(function(a,b){return a+b;},0)/arr.length,1):null};
  }
  function macro(key){
    var arr=[];
    dates.forEach(function(d){var t=dayNutrition(getDay(d));var v=t[key];if(v!==undefined&&v!==null&&v!==''&&!isNaN(Number(v)))arr.push(Number(v));});
    return {n:arr.length, mean: arr.length? round(arr.reduce(function(a,b){return a+b;},0)/arr.length,0):null};
  }
  function count(fn){return dates.filter(fn).length;}
  var kc=macro('kcal'),pr=macro('protein'),cb=macro('carb'),ft=macro('fat'),fb=macro('fiber');
  var w=avgWeight(dates);var wp=avgWeight(rangeDays(addDays(dates[0],-1),7));
  var ws=dates.map(function(d){return num(getDay(d).weight);}).filter(function(x){return x>0;});
  var wMin=ws.length?Math.min.apply(null,ws):null;var wMax=ws.length?Math.max.apply(null,ws):null;
  var wDelta=(w!=null&&wp!=null)?round(w-wp,2):null;
  // ChatGPT 导出减脂趋势指标：最近7日 / 前7日 平均体重（基于区间结束日）

    /* 实际分钟统计（含恢复日走路/拉伸） */
    if(day.workoutParts){var wp=day.workoutParts;
      ['strength','inclineWalk','elliptical','stairMachine','dance','easyWalk','mobility'].forEach(function(k){var p=wp[k];if(p&&p.actual!=null){if(k==='strength'){strengthMin+=p.actual;strengthDays++;}else if(k==='inclineWalk')inclineWalkMin+=p.actual;else if(k==='elliptical')ellipticalMin+=p.actual;else if(k==='stairMachine')stairMachineMin+=p.actual;else if(k==='dance')danceMin+=p.actual;else if(k==='easyWalk')easyWalkMin+=p.actual;else if(k==='mobility')mobilityMin+=p.actual;}});
      aeroMin+=(wp.inclineWalk&&wp.inclineWalk.actual!=null?wp.inclineWalk.actual:0)+(wp.elliptical&&wp.elliptical.actual!=null?wp.elliptical.actual:0)+(wp.stairMachine&&wp.stairMachine.actual!=null?wp.stairMachine.actual:0)+(wp.dance&&wp.dance.actual!=null?wp.dance.actual:0)+(wp.easyWalk&&wp.easyWalk.actual!=null?wp.easyWalk.actual:0);
      if(day.workoutRpe!=null){rpeSum+=num(day.workoutRpe);rpeN++;}
    }
    if(t==='D'){recovery++;return;}
    trainingDays++;
    if(pe&&pe.status==='done')done++;else defer++;
  });
  return {trainingDays:trainingDays,done:done,rate:trainingDays?round(done/trainingDays*100,0):null,recovery:recovery,defer:defer,strengthDays:strengthDays,strengthMin:strengthMin,inclineWalkMin:inclineWalkMin,ellipticalMin:ellipticalMin,stairMachineMin:stairMachineMin,danceMin:danceMin,easyWalkMin:easyWalkMin,mobilityMin:mobilityMin,aeroMin:aeroMin,avgRpe:rpeN?round(rpeSum/rpeN,1):null};
}

function expCompare(exp){
  var ms=exp.metrics||[];
  var bs=addDays(exp.start,-14);
  var before=[];for(var i=0;i<14;i++)before.push(addDays(bs,i));
  var n=daysBetween(exp.start,exp.end);var dur=[];for(var j=0;j<=Math.max(0,n);j++)dur.push(addDays(exp.start,j));
  function vals(dates,key){var v=[];dates.forEach(function(d){var x=getDay(d)[key];if(x!==undefined&&x!==null&&x!=='')v.push(x);});return v;}
  function mean(dates,key){var v=vals(dates,key).map(function(x){return num(x);}).filter(function(x){return !isNaN(x);});return v.length?round(v.reduce(function(a,b){return a+b;},0)/v.length,1):null;}
  function boolRatio(dates,key){var v=vals(dates,key);if(!v.length)return null;var t=v.filter(function(x){return x===true;}).length;return t+'/'+v.length+'（'+round(t/v.length*100,0)+'%）';}
  function gasDist(dates){var v=vals(dates,'gas');if(!v.length)return null;var map={'正常':0,'稍多':1,'明显增多':2,'非常多':3};var cnt={};v.forEach(function(x){cnt[x]=(cnt[x]||0)+1;});var parts=Object.keys(cnt).map(function(k){return k+'×'+cnt[k];});var nums=v.map(function(x){return map[x]!=null?map[x]:null;}).filter(function(x){return x!=null;});var avg=nums.length?round(nums.reduce(function(a,b){return a+b;},0)/nums.length,1):null;return {dist:parts.join('、'),avg:avg};}
  function summarize(key){
    if(key==='bowel'){
      var b=boolRatio(before,key),d=boolRatio(dur,key);
      if(!b&&!d)return {before:null,during:null,text:'数据不足'};
      return {before:b,during:d,text:'前 '+b+' → 后 '+d};
    }
    if(key==='gas'){
      var gb=gasDist(before),gd=gasDist(dur);
      if(!gb&&!gd)return {before:null,during:null,text:'数据不足'};
      return {before:gb?gb.dist:null,during:gd?gd.dist:null,text:'前 '+(gb?gb.dist:'—')+'（均'+(gb?gb.avg:'-')+'）→ 后 '+(gd?gd.dist:'—')+'（均'+(gd?gd.avg:'-')+'）'};
    }
    var bv=mean(before,key),dv=mean(dur,key);
    if(bv==null&&dv==null)return {before:null,during:null,text:'数据不足'};
    var chg=(bv!=null&&dv!=null)?round(dv-bv,1):null;
    return {before:bv,during:dv,text:'前 '+(bv!=null?bv:'—')+' → 后 '+(dv!=null?dv:'—')+(chg!=null?('（'+(chg>0?'+':'')+chg+'）'):'')};
  }
  var out={};
  ms.forEach(function(m){out[m]=summarize(m);});
  return out;
}

  $('#addExp').onclick=function(){

    if(!name||!s||!e){toast('请填名称与起止日期');return;}

function allFieldsFlat(d){
  d=d||{};var o={};
  SECTIONS.forEach(function(s){s.f.forEach(function(f){ if(f.ty==='tags'){var v=d[f.k];o[f.k]=(Array.isArray(v)&&v.length)?v.join('、'):'';} else {o[f.k]= (f.ty==='chk'||f.ty==='tri')?exportBool(d[f.k]):(d[f.k]==null?'':d[f.k]);} });}); /* tri 与 chk 同样导出 是/否/空；tags 数组转中文顿号 */
  var m=dayNutrition(d);o._kcal=m.kcal;o._protein=m.protein;o._carb=m.carb;o._fat=m.fat;o._fiber=m.fiber;o._water=m.water;
  return o;
}
function csvCell(v){v=v==null?'':String(v);if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}
// Item9: 列数校验在序列化前基于数组进行（引号内允许逗号/换行，对最终文本 split 会误判）
function csvBuild(headerArray,rowArrays){
  for(var i=0;i<rowArrays.length;i++){
    if(rowArrays[i].length!==headerArray.length)return {ok:false,row:i+2,expected:headerArray.length,got:rowArrays[i].length}; /* row+2: 表头占1行且行号从1计 */
  }
  var lines=[headerArray.map(csvCell).join(',')].concat(rowArrays.map(function(r){return r.map(csvCell).join(',');}));
  return {ok:true,text:'﻿'+lines.join('\n')};
}
function downloadCsv(text,name){
  if(!text)return; /* 校验已在 csvBuild 阶段完成，失败返回空串则中止 */
  downloadText(text,name,'text/csv;charset=utf-8');
}
/* 文本下载：内部创建 Blob（字符串不能直接传给 URL.createObjectURL） */
function downloadText(text,name,mime){
  download(new Blob([text],{type:mime||'text/plain;charset=utf-8'}),name);
}

  var rowArrays=days.map(function(dStr){var o=allFieldsFlat(getDay(dStr));return [dStr].concat(cols.map(function(c){return o[c];})).concat([state.periodLog[dStr]||'']);});
  var b=csvBuild(headerArray,rowArrays);
  if(!b.ok){toast('导出中止：第 '+b.row+' 行列数('+b.got+')与表头('+b.expected+')不一致');return '';}
  return b.text;
}

  $('#resetData').onclick=function(){if(confirm('确定清空全部数据？此操作不可恢复，建议先导出备份。')){localStorage.removeItem(KEY);state=defaultState();save();UI={dashRange:'7',dailyDate:today(),gutRange:'30',weekEnd:today(),exportStart:addDays(today(),-6),exportEnd:today(),calMonth:today().slice(0,7),quickDate:null,expRange:'7',trendTab:'weight',viewStack:['dashboard'],more:{},opt:{}};render();toast('已清空');}};
  var ct=$('#cloudToken');if(ct)ct.onchange=function(){var c=cloudCfg();c.token=ct.value.trim();saveCloud(c);};
  var cg=$('#cloudGist');if(cg)cg.onchange=function(){var c=cloudCfg();c.gistId=cg.value.trim();saveCloud(c);};
  var ca=$('#cloudAuto');if(ca)ca.onchange=function(){var c=cloudCfg();c.auto=ca.checked;saveCloud(c);toast(c.auto?'已开启自动同步':'已关闭自动同步');};
  var cp=$('#cloudPush');if(cp)cp.onclick=function(){cloudPush();};
  var cpl=$('#cloudPull');if(cpl)cpl.onclick=function(){cloudPull();};
  var ns=$('#nextStage');if(ns)ns.onclick=function(){var ok=enterNextStage();toast(ok?'已进入下一阶段':'已完成第一阶段4周，请结合实际完成率、RPE和不适评分决定是否进入下一阶段');render();};
}

/* ============ 云同步（GitHub 私密 Gist 做中转） ============ */
var CLOUD_KEY='pcos_cloud_v1';
function cloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY))||{};}catch(e){return {};}}
function saveCloud(c){localStorage.setItem(CLOUD_KEY,JSON.stringify(c));}
var _cloudTimer=null;
function cloudPushDebounced(){if(_cloudTimer)clearTimeout(_cloudTimer);_cloudTimer=setTimeout(cloudPush,1200);}
function gistHeaders(token){return {'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json'};}
function cloudNow(){var d=new Date();function p(n){return (n<10?'0':'')+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function cloudPush(){
  var c=cloudCfg();if(!c.token){toast('请先在设置里填写 GitHub 令牌');return;}
  var body={description:'PCOS 减脂追踪工作台 云端数据',public:false,files:{'pcos-state.json':{content:JSON.stringify(state)}}};
  var url=c.gistId?('https://api.github.com/gists/'+c.gistId):'https://api.github.com/gists';
  var method=c.gistId?'PATCH':'POST';
  fetch(url,{method:method,headers:gistHeaders(c.token),body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){c.gistId=j.id;c.lastSync=cloudNow();saveCloud(c);render();toast('已上传到云端 ✓');})
    .catch(function(e){toast('上传失败：'+e.message);});
}
function cloudPull(){
  var c=cloudCfg();if(!c.token||!c.gistId){toast('请先填写令牌与 Gist ID（或先上传一次）');return;}
  fetch('https://api.github.com/gists/'+c.gistId,{headers:gistHeaders(c.token)})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){var f=j.files&&j.files['pcos-state.json'];if(!f){toast('云端没有 pcos-state.json');return;}try{var d=JSON.parse(f.content);state=finalizeState(d);save();}catch(e){toast('云端数据解析失败');return;}c.lastSync=cloudNow();saveCloud(c);render();toast('已从云端拉取 ✓');})
    .catch(function(e){toast('拉取失败：'+e.message);});
}
function cloudSyncCard(){
  var c=cloudCfg();
  return '<div class="card"><h2 style="margin-top:0">'+ICON('cloud')+' 云同步（多设备共享）</h2>'+
    '<label class="fld" style="margin-bottom:10px"><b>GitHub 令牌</b><input type="password" id="cloudToken" placeholder="ghp_xxx（仅需 gist 权限）" value="'+(c.token||'')+'"></label>'+
    '<label class="fld" style="margin-bottom:10px"><b>Gist ID</b><input id="cloudGist" placeholder="留空则首次上传自动创建" value="'+(c.gistId||'')+'"></label>'+
    '<div class="row" style="margin-top:6px"><button class="btn" id="cloudPush">↑ 上传到云端</button><button class="btn ghost" id="cloudPull">↓ 从云端拉取</button></div>'+
    '<label class="chk" style="margin-top:10px"><input type="checkbox" id="cloudAuto" '+(c.auto?'checked':'')+'> 每次保存自动同步到云端</label>'+
    '<div class="note">数据存到你的 GitHub 私密 Gist（URL 不公开列出）。令牌仅保存在本机浏览器，不会进入数据备份文件。换设备时填同一个令牌 + 同一个 Gist ID 即可共享。令牌仅需勾选 gist 权限。</div>'+
    '<div class="mini" style="margin-top:6px">上次同步：'+(c.lastSync||'从未')+'</div></div>';
}
/* ============ 启动 ============ */
state=load();
render();
</script>
